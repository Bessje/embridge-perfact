<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fff; }
  .badge {
    width: 760px; height: 900px; background: #fff;
    border: 1px solid #e3e4e6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "PT Sans", "Segoe UI", system-ui, sans-serif;
  }
  .names {
    font-size: 40px; font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase; color: #53565A;
  }
  .names .x { color: #EFDF00; margin: 0 12px; }
  .tagline { font-size: 18px; color: #6b6e73; margin-top: 12px; }
  .accent { width: 90px; height: 5px; background: #EFDF00; border-radius: 3px; margin: 26px 0 34px; }
  .qr { width: 560px; height: 560px; display: block; }
  .url { margin-top: 28px; font-size: 23px; font-weight: 700; color: #00529b; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="badge">
    <div class="names">Embridge <span class="x">×</span> Perfact</div>
    <div class="tagline">Samen sterker in de energietransitie</div>
    <div class="accent"></div>
    <img class="qr" src="images/qr-embridge-perfact.png" alt="QR-code">
    <div class="url">bessje.github.io/embridge-perfact</div>
  </div>
</body>
</html>
